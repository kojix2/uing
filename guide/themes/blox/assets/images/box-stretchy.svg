<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Horizontal Box size allocation</title>
  <desc id="desc">With B stretchy, B uses the remaining width. With B and C stretchy, B and C receive equal widths. A keeps its required width in both cases.</desc>
  <rect width="720" height="260" rx="8" fill="#fff"/>
  <g font-family="monospace" font-size="17" fill="#334155">
    <text x="24" y="30">stretchy: A=false, B=true, C=false</text>
    <text x="24" y="154">stretchy: A=false, B=true, C=true</text>
  </g>
  <g fill="#f8fafc" stroke="#64748b" stroke-width="1.5">
    <rect x="24" y="50" width="80" height="60"/>
    <rect x="616" y="50" width="80" height="60"/>
    <rect x="24" y="174" width="80" height="60"/>
  </g>
  <g fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5">
    <rect x="120" y="50" width="480" height="60"/>
    <rect x="120" y="174" width="280" height="60"/>
    <rect x="416" y="174" width="280" height="60"/>
  </g>
  <g font-family="sans-serif" font-size="20" text-anchor="middle" fill="#334155">
    <text x="64" y="87">A</text><text x="360" y="87">B</text><text x="656" y="87">C</text>
    <text x="64" y="211">A</text><text x="260" y="211">B</text><text x="556" y="211">C</text>
  </g>
</svg>
