<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">Box spacing and window margins</title>
  <desc id="desc">The blue margin surrounds the Box inside the window. Orange gaps separate children A, B, and C inside the Box.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="720" height="240" rx="8" fill="#fff"/>
  <!-- Blue: window margin. Orange: gaps between Box children. -->
  <rect x="24" y="68" width="672" height="132" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <rect x="64" y="104" width="592" height="60" fill="#ffedd5"/>
  <g fill="#f8fafc" stroke="#64748b" stroke-width="1.5">
    <rect x="64" y="104" width="176" height="60"/>
    <rect x="272" y="104" width="176" height="60"/>
    <rect x="480" y="104" width="176" height="60"/>
  </g>
  <g font-family="sans-serif" font-size="20" text-anchor="middle" fill="#334155">
    <text x="152" y="141">A</text>
    <text x="360" y="141">B</text>
    <text x="568" y="141">C</text>
  </g>
  <g fill="none" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M29 134H59" stroke="#0284c7"/>
    <path d="M245 134H267" stroke="#c2410c"/>
    <path d="M453 134H475" stroke="#c2410c"/>
  </g>
  <g font-family="monospace" font-size="18">
    <text x="24" y="32" fill="#0369a1">Window: margined = true</text>
    <text x="384" y="32" fill="#9a3412">Box: padded = true</text>
  </g>
  <g fill="none" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M164 42V86" stroke="#0284c7"/>
    <path d="M464 42V118" stroke="#c2410c"/>
  </g>
</svg>
