name: CI • Windows (x64, MinGW64)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    env:
      CRYSTAL_VERSION: "1.21.0"
      CRYSTAL_SHA256: d0f6f50b16720b240a4c49563c7670ddf1a790fd84c04b29d09818cd9b20608f
      CRYSTAL_ROOT: /opt/crystal
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gc
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libyaml
            mingw-w64-x86_64-llvm-libs
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-zlib
            git
            unzip

      - name: Install Crystal GNU preview
        shell: msys2 {0}
        run: |
          archive="$(cygpath -u "$RUNNER_TEMP")/crystal.zip"
          url="https://github.com/crystal-lang/crystal/releases/download/${CRYSTAL_VERSION}/crystal-${CRYSTAL_VERSION}-windows-x86_64-gnu-unsupported.zip"
          curl --fail --location --retry 3 --output "$archive" "$url"
          echo "${CRYSTAL_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "$archive" -d "$CRYSTAL_ROOT"
          export PATH="$CRYSTAL_ROOT/bin:$PATH"
          crystal --version
          shards --version

      - name: Install dependencies
        shell: msys2 {0}
        run: |
          export PATH="$CRYSTAL_ROOT/bin:$PATH"
          shards install

      - name: Download libui library
        shell: msys2 {0}
        run: |
          export PATH="$CRYSTAL_ROOT/bin:$PATH"
          crystal run download.cr
          ls libui

      - name: Run tests
        shell: msys2 {0}
        run: |
          export PATH="$CRYSTAL_ROOT/bin:$PATH"
          crystal spec

      - name: Build all examples
        shell: msys2 {0}
        run: |
          export PATH="$CRYSTAL_ROOT/bin:$PATH"
          for f in examples/*.cr; do crystal build "$f"; done
          ls -l
