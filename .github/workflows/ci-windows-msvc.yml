name: CI • Windows (x64, MSVC)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: shards install

      - name: Download libui library
        run: |
          crystal run download.cr
          ls libui

      - name: Run tests
        run: crystal spec

      - name: Run native GUI tests
        timeout-minutes: 2
        env:
          UING_NATIVE_GUI_TESTS: "1"
        run: crystal spec spec/native

      - name: Verify dynamic and static CRT linking
        run: |
          crystal build examples/basic_button_dsl.cr -o "$env:RUNNER_TEMP/basic-button-debug-md.exe"
          crystal build --static examples/basic_button_dsl.cr -o "$env:RUNNER_TEMP/basic-button-debug-mt.exe"
          crystal build --release --no-debug examples/basic_button_dsl.cr -o "$env:RUNNER_TEMP/basic-button-release-md.exe"
          crystal build --release --no-debug --static examples/basic_button_dsl.cr -o "$env:RUNNER_TEMP/basic-button-release-mt.exe"

      - name: Build all examples
        run: |
          Get-ChildItem -Path examples -Filter *.cr | ForEach-Object { crystal build $_.FullName }
          ls
